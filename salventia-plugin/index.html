<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Install Salventia Codex Plugin</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fa;
        color: #17181a;
      }

      main {
        width: min(720px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 20px;
        color: #4b5563;
        font-size: 17px;
      }

      pre {
        overflow-x: auto;
        padding: 18px;
        border: 1px solid #d9dde3;
        border-radius: 8px;
        background: #ffffff;
        font-size: 15px;
      }

      code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      a {
        color: #0b65c2;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111315;
          color: #f4f5f6;
        }

        p {
          color: #b8bec7;
        }

        pre {
          border-color: #343941;
          background: #181b1f;
        }

        a {
          color: #7bb6ff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Salventia Codex Plugin</h1>
      <p>Give Codex this page and ask it to install the plugin. It should add the marketplace, then install <code>venue-admin-populator</code>.</p>
      <pre><code>codex plugin marketplace add mmaksin/share
codex plugin add venue-admin-populator@mmaksin-share</code></pre>
      <p>Plugin source: <a href="https://github.com/mmaksin/share/tree/main/salventia-plugin">github.com/mmaksin/share</a></p>
    </main>
  </body>
</html>
