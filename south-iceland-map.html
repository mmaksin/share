let map, infoWindow;
const markers = [];
const activeFilters = new Set(CATS.map(c => c.id));
let showFavsOnly = false;

// ── Cookie helpers ─────────────────────────────────────────────────────────
function getFavorites() {
  const m = document.cookie.match(/(?:^|; )favorites=([^;]*)/);
  return m ? new Set(decodeURIComponent(m[1]).split(',').filter(Boolean)) : new Set();
}
function saveFavorites(set) {
  document.cookie = `favorites=${encodeURIComponent([...set].join(','))};max-age=31536000;path=/`;
}
function isFav(name) { return getFavorites().has(name); }
function toggleFav(name) {
  const favs = getFavorites();
  favs.has(name) ? favs.delete(name) : favs.add(name);
  saveFavorites(favs);
  return favs.has(name);
}

// ── Popup builder ──────────────────────────────────────────────────────────
let _openPlace = null, _openMarker = null;

function ratingLineHtml(place) {
  if (place.rating) return starsHtml(place.rating, place.ratingCount, place.placeId);
  return `<div id="rating-placeholder" style="font-size:.72rem;color:#4a7090;margin-bottom:6px;">⭐ fetching rating…</div>`;
}

function openPopup(place, marker) {
  _openPlace = place; _openMarker = marker;
  const cat = catFor(place.cat);
  const fav = isFav(place.name);
  const link = place.url.startsWith('http') ? place.url : BASE + place.url;
  infoWindow.setContent(`
    <div style="background:#1a2a3d;color:#e8edf2;padding:13px 15px;border-radius:10px;max-width:270px;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5);">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px;">
        <div style="font-size:.95rem;font-weight:700;color:#fff;">${place.name}</div>
        <button id="fav-toggle" title="${fav ? 'Remove from favorites' : 'Add to favorites'}"
          style="background:none;border:none;cursor:pointer;font-size:1.2rem;line-height:1;padding:0;flex-shrink:0;
          filter:${fav ? 'none' : 'grayscale(1) opacity(0.45)'};transition:filter .15s;">❤️</button>
      </div>
      <span style="display:inline-block;background:${cat.color}25;color:${cat.color};border:1px solid ${cat.color}60;
        padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:600;margin-bottom:8px;">${cat.emoji} ${cat.label}</span>
      ${ratingLineHtml(place)}
      <div style="font-size:.8rem;color:#b0c8d8;line-height:1.5;margin-bottom:10px;">${place.desc}</div>
      <a href="${link}" target="_blank"
        style="display:inline-block;background:${cat.color}30;color:${cat.color};border:1px solid ${cat.color}70;
        padding:4px 12px;border-radius:8px;font-size:.72rem;font-weight:600;text-decoration:none;">
        → Visit page
      </a>
    </div>`);
  infoWindow.open(map, marker);
  google.maps.event.addListenerOnce(infoWindow, 'domready', () => {
    document.getElementById('fav-toggle').addEventListener('click', () => {
      const nowFav = toggleFav(place.name);
      document.getElementById('fav-toggle').style.filter = nowFav ? 'none' : 'grayscale(1) opacity(0.45)';
      document.getElementById('fav-toggle').title = nowFav ? 'Remove from favorites' : 'Add to favorites';
      marker.setIcon(makeIcon(place.cat, nowFav));
      updateFavChip();
      if (showFavsOnly) updateVisibility();
    });
  });
}

function refreshOpenPopupRating() {
  if (!_openPlace || !_openPlace.rating) return;
  const el = document.getElementById('rating-placeholder');
  if (el) el.outerHTML = starsHtml(_openPlace.rating, _openPlace.ratingCount, _openPlace.placeId);
}

function catFor(id) { return CATS.find(c => c.id === id); }

function makeIcon(catId, fav) {
  const cat = catFor(catId);
  const heart = fav ? `<text x="23" y="9" font-size="10" text-anchor="middle">❤️</text>` : '';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="30" height="38" viewBox="0 0 30 38">
    <path d="M15 0C6.72 0 0 6.72 0 15c0 11.25 15 23 15 23S30 26.25 30 15C30 6.72 23.28 0 15 0z"
      fill="${cat.color}" stroke="rgba(255,255,255,0.65)" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="8.5" fill="rgba(0,0,0,0.2)"/>
    <text x="15" y="19.5" font-size="10" text-anchor="middle" fill="white">${cat.emoji}</text>
    ${heart}
  </svg>`;
  return {
    url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
    scaledSize: new google.maps.Size(30, 38),
    anchor: new google.maps.Point(15, 38)
  };
}

function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 64.05, lng: -20.8 },
    zoom: 7,
    mapTypeId: 'terrain',
    mapTypeControl: true,
    mapTypeControlOptions: { position: google.maps.ControlPosition.TOP_RIGHT, style: google.maps.MapTypeControlStyle.DROPDOWN_MENU },
    fullscreenControl: true,
    streetViewControl: false,
    styles: [
      { elementType:'geometry', stylers:[{color:'#1a2535'}] },
      { elementType:'labels.text.stroke', stylers:[{color:'#0f1923'}] },
      { elementType:'labels.text.fill', stylers:[{color:'#90a8c0'}] },
      { featureType:'water', elementType:'geometry', stylers:[{color:'#0d2a3e'}] },
      { featureType:'water', elementType:'labels.text.fill', stylers:[{color:'#4a8aaa'}] },
      { featureType:'landscape.natural', elementType:'geometry', stylers:[{color:'#1e3347'}] },
      { featureType:'landscape.natural.terrain', elementType:'geometry', stylers:[{color:'#243d50'}] },
      { featureType:'road', elementType:'geometry', stylers:[{color:'#2a4a6a'}] },
      { featureType:'road.arterial', elementType:'geometry', stylers:[{color:'#2a5a7a'}] },
      { featureType:'road', elementType:'labels.text.fill', stylers:[{color:'#6a9ab0'}] },
      { featureType:'administrative', elementType:'geometry.stroke', stylers:[{color:'#1e4060'}] },
      { featureType:'administrative', elementType:'labels.text.fill', stylers:[{color:'#8ab0c8'}] },
      { featureType:'poi', stylers:[{visibility:'off'}] },
    ]
  });

  infoWindow = new google.maps.InfoWindow({ pixelOffset: new google.maps.Size(0,-4) });
  infoWindow.addListener('closeclick', () => { _openPlace = null; _openMarker = null; });

  PLACES.forEach(place => {
    const marker = new google.maps.Marker({
      position: { lat: place.lat, lng: place.lng },
      map, title: place.name, icon: makeIcon(place.cat, isFav(place.name)), visible: true
    });
    marker.addListener('click', () => openPopup(place, marker));
    place._marker = marker;
    markers.push({ place, marker });
  });

  buildFilters();
  buildStarFilter();
  updateStats();
  fetchAllRatings();
}

function getSearchQuery() {
  return document.getElementById('search').value.toLowerCase().trim();
}

function updateVisibility() {
  const q = getSearchQuery();
  const favs = getFavorites();
  let visible = 0;
  markers.forEach(({place, marker}) => {
    const inCat = activeFilters.has(place.cat);
    const inSearch = !q || place.name.toLowerCase().includes(q) || place.desc.toLowerCase().includes(q);
    const inFavs = !showFavsOnly || favs.has(place.name);
    const inRating = minRating === 0 || (place.rating && place.rating >= minRating);
    const show = inCat && inSearch && inFavs && inRating;
    marker.setVisible(show);
    if (show) visible++;
  });
  const q2 = q ? ` matching "${q}"` : '';
  document.getElementById('stats').textContent = `Showing ${visible} of ${PLACES.length} destinations${q2} · Click any marker for details`;
  document.getElementById('map-count').textContent = `${visible} / ${PLACES.length}`;
}

function updateFavChip() {
  const count = getFavorites().size;
  const chip = document.getElementById('fav-chip');
  chip.textContent = count ? `❤️ Favorites (${count})` : '❤️ Favorites';
  chip.className = showFavsOnly ? 'fav-active' : (count ? '' : 'fav-inactive');
}

// ── Star ratings ───────────────────────────────────────────────────────────
let minRating = 0;
const RATINGS_KEY = 'iceland_map_ratings_v2';
const CACHE_TTL = 30 * 24 * 60 * 60 * 1000; // 30 days

function starsHtml(rating, count, placeId) {
  if (!rating) return '';
  const full = Math.floor(rating);
  const half = (rating - full) >= 0.3 ? 1 : 0;
  const empty = 5 - full - half;
  const stars = '★'.repeat(full) + (half ? '⯨' : '') + '☆'.repeat(empty);
  const cnt = count ? ` <span style="opacity:.55">(${count >= 1000 ? (count/1000).toFixed(1)+'k' : count})</span>` : '';
  const href = placeId ? `https://www.google.com/maps/place/?q=place_id:${placeId}` : `https://www.google.com/maps/search/${encodeURIComponent(stars)}`;
  return `<a href="${href}" target="_blank" style="display:block;color:#f5c842;font-size:.8rem;margin-bottom:6px;text-decoration:none;cursor:pointer;" title="View on Google Maps">${stars} <span style="color:#c8a820">${rating.toFixed(1)}</span>${cnt} <span style="font-size:.6rem;color:#4a9abb">↗</span></a>`;
}

function loadRatingsCache() {
  try {
    const raw = localStorage.getItem(RATINGS_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Date.now() - obj.ts > CACHE_TTL) return null;
    if (Object.keys(obj.data).length === 0) return null; // don't re-use empty cache
    return obj.data;
  } catch(e) { return null; }
}

function applyRatings(data) {
  PLACES.forEach(p => {
    if (data[p.name]) { p.rating = data[p.name].r; p.ratingCount = data[p.name].c; p.placeId = data[p.name].id; }
  });
}

function saveRatingsCache() {
  const data = {};
  PLACES.forEach(p => { if (p.rating) data[p.name] = { r: p.rating, c: p.ratingCount || 0, id: p.placeId || null }; });
  if (Object.keys(data).length === 0) return; // don't cache empty results
  try { localStorage.setItem(RATINGS_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
}

function normalizeQuery(name) {
  return name
    .replace(/[áàâ]/gi, 'a').replace(/[éèê]/gi, 'e').replace(/[íìî]/gi, 'i')
    .replace(/[óòô]/gi, 'o').replace(/[úùû]/gi, 'u').replace(/[ý]/gi, 'y')
    .replace(/[ä]/gi, 'ae').replace(/[ö]/gi, 'o').replace(/[ü]/gi, 'u')
    .replace(/[ð]/gi, 'd').replace(/[þ]/gi, 'th').replace(/[æ]/gi, 'ae')
    .replace(/[ø]/gi, 'o');
}

async function fetchPlaceRating(place, service) {
  const trySearch = (query) => new Promise(resolve => {
    service.textSearch({
      query,
      location: new google.maps.LatLng(place.lat, place.lng),
      radius: 1000
    }, (results, status) => {
      if (status === google.maps.places.PlacesServiceStatus.OK && results?.[0]?.rating) {
        resolve({ r: results[0].rating, c: results[0].user_ratings_total || 0, id: results[0].place_id || null });
      } else resolve(null);
    });
  });

  // Try original name first, then ASCII-normalized fallback
  const searchName = place.searchName || place.name;
  const result = await trySearch(`${searchName} Iceland`);
  if (result) return result;
  const normalized = normalizeQuery(searchName);
  if (normalized !== searchName) return await trySearch(`${normalized} Iceland`);
  return null;
}

async function fetchAllRatings() {
  const cached = loadRatingsCache();
  if (cached) { applyRatings(cached); updateVisibility(); return; }

  if (!google.maps.places) {
    document.getElementById('rating-loading').textContent = '(Places API unavailable)';
    return;
  }

  const service = new google.maps.places.PlacesService(map);
  const loading = document.getElementById('rating-loading');

  // Probe first place to check API is working before running all 267
  loading.textContent = 'Checking ratings API…';
  const probe = await fetchPlaceRating(PLACES[0], service);
  if (!probe) {
    loading.textContent = '⚠ Ratings unavailable — enable Places API for this key';
    return;
  }
  PLACES[0].rating = probe.r; PLACES[0].ratingCount = probe.c; PLACES[0].placeId = probe.id;

  const BATCH = 4;
  let done = 1;
  const remaining = PLACES.slice(1);

  for (let i = 0; i < remaining.length; i += BATCH) {
    const batch = remaining.slice(i, i + BATCH);
    await Promise.all(batch.map(async p => {
      const res = await fetchPlaceRating(p, service);
      if (res) { p.rating = res.r; p.ratingCount = res.c; p.placeId = res.id; }
      done++;
    }));
    loading.textContent = `Fetching ratings… ${Math.round(done / PLACES.length * 100)}%`;
    refreshOpenPopupRating();
    await new Promise(r => setTimeout(r, 300));
  }
  loading.textContent = '';
  saveRatingsCache();
  updateVisibility();
  const rated = PLACES.filter(p => p.rating).length;
  if (rated > 0) {
    document.getElementById('rating-loading').textContent = `${rated} ratings loaded`;
    setTimeout(() => { document.getElementById('rating-loading').textContent = ''; }, 3000);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('rating-retry').addEventListener('click', () => {
    localStorage.removeItem(RATINGS_KEY);
    PLACES.forEach(p => { delete p.rating; delete p.ratingCount; delete p.placeId; });
    document.getElementById('rating-retry').style.display = 'none';
    fetchAllRatings();
  });
});

function buildStarFilter() {
  document.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      minRating = parseFloat(btn.dataset.min);
      document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('star-active'));
      btn.classList.add('star-active');
      updateVisibility();
    });
  });
}

function buildFilters() {
  const el = document.getElementById('filters');
  CATS.forEach(cat => {
    const count = PLACES.filter(p => p.cat === cat.id).length;
    if (!count) return;
    const btn = document.createElement('button');
    btn.className = 'filter-btn active';
    btn.style.color = cat.color;
    btn.style.borderColor = cat.color + '60';
    btn.style.background = cat.color + '18';
    btn.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.label}<span class="badge">${count}</span>`;
    btn.addEventListener('click', () => {
      if (activeFilters.has(cat.id)) { activeFilters.delete(cat.id); btn.classList.replace('active','inactive'); }
      else { activeFilters.add(cat.id); btn.classList.replace('inactive','active'); }
      updateVisibility();
    });
    el.appendChild(btn);
  });

  const toggleAllBtn = document.getElementById('toggle-all');
  function allActive() { return CATS.every(c => activeFilters.has(c.id)); }
  function syncToggleLabel() { toggleAllBtn.textContent = allActive() ? 'Deselect all' : 'Select all'; }
  toggleAllBtn.addEventListener('click', () => {
    const chipBtns = el.querySelectorAll('.filter-btn');
    if (allActive()) {
      CATS.forEach(c => activeFilters.delete(c.id));
      chipBtns.forEach(b => b.classList.replace('active', 'inactive'));
    } else {
      CATS.forEach(c => activeFilters.add(c.id));
      chipBtns.forEach(b => b.classList.replace('inactive', 'active'));
    }
    syncToggleLabel();
    updateVisibility();
  });
  el.querySelectorAll('.filter-btn').forEach(b => {
    b.addEventListener('click', syncToggleLabel, true);
  });

  const favChip = document.getElementById('fav-chip');
  favChip.addEventListener('click', () => {
    showFavsOnly = !showFavsOnly;
    updateFavChip();
    updateVisibility();
  });
  updateFavChip();

  const searchEl = document.getElementById('search');
  const clearBtn = document.getElementById('search-clear');
  searchEl.addEventListener('input', () => {
    clearBtn.style.display = searchEl.value ? 'block' : 'none';
    updateVisibility();
  });
  clearBtn.addEventListener('click', () => {
    searchEl.value = '';
    clearBtn.style.display = 'none';
    searchEl.focus();
    updateVisibility();
  });
}

function updateStats() { updateVisibility(); }
</script>
