<!DOCTYPE html>
<html lang="ru" id="root-html">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WellHealth · Прототип v0.2 (RU)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet"/>

<style>
:root {
  --teal:        #1B4D54;
  --teal-deep:   #103942;
  --teal-soft:   #2D6770;
  --sienna:      #C2724A;
  --sienna-soft: #DDA181;
  --sienna-ink:  #7A4426;
  --bone:        #F4EFE4;
  --bone-warm:   #EBE3D2;
  --surface:     #FFFFFF;
  --ink:         #1F262B;
  --ink-soft:    #6B7378;
  --line:        #E2DBC9;
  --danger:      #8B3A2F;
  --shadow-sm:   0 4px 14px rgba(27, 77, 84, 0.08);
  --shadow-md:   0 10px 30px rgba(27, 77, 84, 0.12);
  --shadow-lg:   0 30px 60px rgba(27, 77, 84, 0.18);
  --r-card: 12px;
  --r-soft: 10px;
  --r-pill: 999px;
}
*,*::before,*::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(1200px 600px at 8% -10%, #fbf7ed 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 110%, #e8efef 0%, transparent 60%),
    var(--bone);
  color: var(--ink); min-height: 100vh; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; }

/* ---------- Page chrome ---------- */
.page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 80px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 10px;
  background: var(--teal); color: var(--bone);
  display: grid; place-items: center;
  font-family: 'Lora', serif; font-size: 24px; font-weight: 600;
  box-shadow: var(--shadow-sm); position: relative;
}
.brand-mark::after {
  content: ''; position: absolute; right: -2px; bottom: -2px;
  width: 10px; height: 10px; border-radius: 3px;
  background: var(--sienna); box-shadow: 0 2px 6px rgba(194,114,74,0.35);
}
.brand-name { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; }
.brand-sub { font-size: 11px; color: var(--ink-soft); letter-spacing: 1.6px; text-transform: uppercase; margin-top: 4px; font-weight: 600; }
.page-meta { font-size: 13px; color: var(--ink-soft); line-height: 1.6; max-width: 64ch; }
.page-meta b { color: var(--ink); font-weight: 600; }

.lang-toggle { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px; box-shadow: var(--shadow-sm); }
.lang-toggle button { border: 0; background: transparent; padding: 7px 16px; font-size: 13px; border-radius: var(--r-pill); cursor: pointer; color: var(--ink-soft); font-weight: 500; }
.lang-toggle button.is-active { background: var(--teal); color: var(--bone); }

.legend {
  margin-top: 16px; padding: 14px 18px; border-radius: var(--r-card);
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-soft);
  font-size: 13px; line-height: 1.65;
}
.legend b { color: var(--ink); }

/* ---------- Stage layout ---------- */
.stage {
  margin-top: 28px;
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 40px;
  align-items: start;
}
@media (max-width: 940px) { .stage { grid-template-columns: 1fr; } }

/* ---------- Phone shell ---------- */
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.phone {
  width: 360px; height: 760px;
  border-radius: 50px;
  background: #111; padding: 14px;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.4) inset;
  position: relative;
}
.phone::after {
  content: ''; position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 30px; background: #000; border-radius: 16px; z-index: 5;
}
.screen {
  width: 100%; height: 100%;
  background: var(--bone);
  border-radius: 38px; overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
}
.status-bar { height: 46px; flex: 0 0 46px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 26px 6px; font-size: 12px; color: var(--ink); font-weight: 600; }
.status-bar .right { display: flex; gap: 6px; align-items: center; }
.dot { width: 6px; height: 6px; background: var(--ink); border-radius: 50%; }

.nav-top {
  height: 56px; flex: 0 0 56px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
}
.nav-top .icon-btn {
  width: 36px; height: 36px; border-radius: 10px; background: var(--surface);
  display: grid; place-items: center; color: var(--ink); border: 1px solid var(--line);
  font-size: 16px; cursor: pointer; transition: background .12s ease;
}
.nav-top .icon-btn:hover { background: var(--bone-warm); }
.nav-top .title { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; }

.scroll { flex: 1; overflow-y: auto; padding: 0 18px 16px; }

.nav-bottom {
  height: 76px; flex: 0 0 76px;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px;
}
.nb-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--ink-soft); font-weight: 500; cursor: pointer; }
.nb-item.is-active { color: var(--teal); }
.nb-glyph { width: 28px; height: 28px; border-radius: 8px; background: var(--bone-warm); display: grid; place-items: center; font-size: 13px; }
.nb-item.is-active .nb-glyph { background: var(--teal); color: var(--bone); }

/* ---------- Reusable type ---------- */
.eyebrow { font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--sienna-ink); font-weight: 700; }
.serif { font-family: 'Lora', serif; font-weight: 500; line-height: 1.15; }

/* ---------- Home / Matcher ---------- */
.greet-block { padding-top: 4px; }
.greet { font-family: 'Lora', serif; font-size: 22px; font-weight: 500; }
.greet .nm { color: var(--teal); }
.greet-sub { color: var(--ink-soft); font-size: 13px; margin-top: 4px; }

.matcher-card {
  margin-top: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--sienna);
  border-radius: var(--r-card);
  padding: 16px;
}
.matcher-q { font-family: 'Lora', serif; font-size: 17px; font-weight: 500; color: var(--teal-deep); margin-bottom: 10px; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.s-chip {
  padding: 6px 11px; border-radius: var(--r-pill);
  background: var(--bone); color: var(--ink-soft);
  border: 1px solid var(--line);
  font-size: 12px; font-weight: 500; cursor: pointer;
  transition: background .12s ease, color .12s ease, border-color .12s ease;
}
.s-chip:hover { border-color: var(--teal-soft); color: var(--teal); }
.s-chip.is-active { background: var(--teal); color: var(--bone); border-color: var(--teal); }

.text-input-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.text-input {
  flex: 1; min-width: 0;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: var(--r-soft);
  background: var(--bone);
  font: inherit; font-size: 12.5px;
  color: var(--ink);
  transition: border-color .12s ease, background .12s ease;
}
.text-input::placeholder { color: var(--ink-soft); }
.text-input:focus { border-color: var(--teal); outline: none; background: var(--surface); }
.text-input:disabled { opacity: 0.6; cursor: not-allowed; }
.submit-btn {
  width: 36px; height: 36px; flex: 0 0 36px;
  border: 0; border-radius: var(--r-soft);
  background: var(--teal); color: var(--bone);
  cursor: pointer; font-size: 16px;
  display: grid; place-items: center;
  transition: opacity .12s ease, transform .12s ease;
}
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.submit-btn:not(:disabled):hover { transform: translateY(-1px); }
.loader-dot {
  display: block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--bone);
  animation: ldot 0.9s infinite ease-in-out;
}
@keyframes ldot {
  0%, 100% { opacity: 0.3; transform: scale(0.7); }
  50%      { opacity: 1;   transform: scale(1.2); }
}
.loading-line {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; color: var(--ink-soft);
  padding: 2px 2px 8px;
}
.loading-line::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--sienna); animation: ldot 0.9s infinite ease-in-out;
}
.or-row {
  font-size: 10.5px; color: var(--ink-soft);
  margin: 4px 0 8px;
  letter-spacing: 0.4px;
  text-transform: lowercase;
}
.no-match {
  font-size: 11.5px; color: var(--ink-soft);
  background: var(--bone-warm);
  border: 1px solid var(--line);
  border-radius: var(--r-soft);
  padding: 9px 11px;
  margin-top: 6px;
  line-height: 1.55;
}
.submit-btn.submit-btn--text {
  width: auto; flex: 0 0 auto;
  padding: 0 14px;
  font-size: 12.5px; font-weight: 600;
  height: 36px;
}

.section-h { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
.section-h .lbl { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.section-h a { font-size: 12px; color: var(--teal); font-weight: 600; cursor: pointer; }

.match-card {
  display: grid; grid-template-columns: 48px 1fr; gap: 11px;
  padding: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-soft);
  margin-bottom: 7px;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .15s ease;
}
.match-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.match-card .thumb {
  width: 48px; height: 48px; border-radius: 9px;
  display: grid; place-items: center;
  font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: var(--bone);
}
.match-card .name { font-weight: 600; font-size: 13px; }
.match-card .why { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.45; }
.match-card .price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 5px; gap: 8px; }
.match-card .price { font-family: 'Lora', serif; font-size: 14px; font-weight: 600; color: var(--teal-deep); white-space: nowrap; }
.match-card .loc { font-size: 11px; color: var(--ink-soft); }

.thumb.lans      { background: linear-gradient(135deg, #A8B2A8 0%, #3F4A47 100%); }
.thumb.bad-ragaz { background: linear-gradient(135deg, #7E8B8E 0%, #3A4549 100%); }
.thumb.sha       { background: linear-gradient(135deg, #C5B8A3 0%, #7A6D56 100%); }
.thumb.karlovy   { background: linear-gradient(135deg, #B89970 0%, #5C4220 100%); }
.thumb.marianske { background: linear-gradient(135deg, #B0A488 0%, #5C4F33 100%); }
.thumb.heviz     { background: linear-gradient(135deg, #8AA398 0%, #3D5447 100%); }
.thumb.rixos     { background: linear-gradient(135deg, #C29066 0%, #6E4D2E 100%); }
.thumb.atmanjai  { background: linear-gradient(135deg, #97A88E 0%, #4A5A40 100%); }
.thumb.kislovodsk{ background: linear-gradient(135deg, #9DA67A 0%, #4F5536 100%); }
.thumb.velingrad { background: linear-gradient(135deg, #A38670 0%, #5A4231 100%); }
.thumb.altay     { background: linear-gradient(135deg, #6F8B82 0%, #2D423B 100%); }
.thumb.heritance { background: linear-gradient(135deg, #B8A47C 0%, #6B5832 100%); }
.thumb.terme     { background: linear-gradient(135deg, #8FA6A2 0%, #3F5650 100%); }

/* ---------- Detail screen ---------- */
.det-hero { height: 180px; flex: 0 0 180px; position: relative; overflow: hidden; }
.det-hero .nav { position: absolute; top: 14px; width: 36px; height: 36px; border-radius: 10px; background: rgba(244,239,228,0.95); display: grid; place-items: center; color: var(--ink); cursor: pointer; }
.det-hero .nav.left { left: 14px; }
.det-hero .nav.right { right: 14px; }
.det-title-block { background: var(--surface); padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
.det-title-block .name { font-family: 'Lora', serif; font-size: 22px; font-weight: 500; line-height: 1.2; }
.det-title-block .loc { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
.fact-table { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--r-soft); overflow: hidden; background: var(--bone-warm); }
.fact-row { display: flex; padding: 8px 12px; gap: 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
.fact-row:last-child { border-bottom: 0; }
.fact-row .k { color: var(--ink-soft); flex: 0 0 100px; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 600; font-size: 10.5px; padding-top: 1px; }
.fact-row .v { color: var(--ink); font-weight: 500; }

.why-panel { margin-top: 12px; border: 1px solid var(--sienna); background: rgba(194,114,74,0.06); border-radius: var(--r-card); padding: 14px 16px; }
.why-panel h4 { margin: 6px 0 8px; font-family: 'Lora', serif; font-weight: 600; font-size: 16px; color: var(--teal-deep); }
.why-list { margin: 0; padding-inline-start: 18px; font-size: 12.5px; line-height: 1.6; color: var(--ink); }
.why-list li { margin-bottom: 5px; }
.why-cons { font-size: 11.5px; color: var(--danger); margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(139,58,47,0.2); }

.cta-stack { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: var(--r-soft); border: 0; cursor: pointer; font-weight: 600; font-size: 13px; background: var(--teal); color: var(--bone); width: 100%; }
.btn.ghost { background: transparent; border: 1px solid var(--teal); color: var(--teal); }

/* ---------- Saved / PDF screen ---------- */
.saved-frame { padding-top: 6px; }
.saved-banner { background: var(--surface); border: 1px solid var(--sienna); border-radius: var(--r-card); padding: 14px; margin-bottom: 14px; position: relative; overflow: hidden; }
.saved-banner::after { content: ''; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(194,114,74,0.18) 0%, transparent 70%); }
.saved-banner .ttl { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; color: var(--teal-deep); }
.saved-banner .sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

.pdf-mock {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: 16px; min-height: 200px; margin-bottom: 14px;
  position: relative;
}
.pdf-mock::before { content: 'PDF'; position: absolute; top: 12px; right: 14px; font-size: 9px; letter-spacing: 1.3px; font-weight: 700; color: var(--ink-soft); }
.pdf-line { background: var(--line); height: 8px; border-radius: 2px; margin-bottom: 8px; }
.pdf-line.s60 { width: 60%; }
.pdf-line.s90 { width: 90%; }
.pdf-line.s40 { width: 40%; height: 12px; background: var(--teal); margin-bottom: 14px; }
.pdf-line.s75 { width: 75%; }
.pdf-line.s30 { width: 30%; background: var(--sienna); height: 6px; }

.share-list { display: flex; flex-direction: column; gap: 8px; }
.share-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-soft);
  cursor: pointer; transition: background .12s ease;
}
.share-row:hover { background: var(--bone-warm); }
.share-row .ic { width: 28px; height: 28px; border-radius: 7px; background: var(--bone-warm); display: grid; place-items: center; color: var(--teal); font-size: 13px; font-weight: 700; }
.share-row .nm { font-size: 13px; font-weight: 500; }

.share-foot { font-size: 11px; color: var(--ink-soft); margin-top: 12px; padding: 0 4px; }

/* ---------- Browse screen ---------- */
.search-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-soft); margin-bottom: 10px; }
.search-bar .ic { color: var(--ink-soft); font-size: 14px; }
.search-bar .input { flex: 1; font-size: 13px; color: var(--ink-soft); }

.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

.browse-card {
  display: grid; grid-template-columns: 48px 1fr;
  gap: 11px; padding: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-soft);
  margin-bottom: 7px; cursor: pointer;
  transition: transform .12s ease, box-shadow .15s ease;
}
.browse-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.browse-card .thumb {
  width: 48px; height: 48px; border-radius: 9px;
  display: grid; place-items: center;
  font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: var(--bone);
}
.browse-card .name { font-weight: 600; font-size: 13px; }
.browse-card .loc { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.browse-card .price { font-family: 'Lora', serif; font-size: 13px; font-weight: 600; color: var(--teal-deep); margin-top: 4px; }
.browse-card .tags { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.browse-card .tag { font-size: 10px; padding: 2px 7px; background: rgba(27,77,84,0.07); color: var(--teal-deep); border: 1px solid rgba(27,77,84,0.18); border-radius: var(--r-pill); }

/* ---------- Profile screen ---------- */
.profile-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: 14px; margin-bottom: 12px;
}
.profile-card .lbl { font-size: 10.5px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.profile-card .lbl + .v { margin-top: 4px; font-size: 14px; font-weight: 500; }
.profile-card .v.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.profile-card .edit { font-size: 12px; color: var(--teal); font-weight: 600; cursor: pointer; }
.profile-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

.doc-row {
  display: flex; gap: 10px; padding: 10px 12px; background: var(--bone-warm);
  border-radius: var(--r-soft); margin-bottom: 6px; align-items: center;
}
.doc-row .ic { width: 30px; height: 30px; border-radius: 7px; background: var(--surface); display: grid; place-items: center; color: var(--teal); font-weight: 700; font-size: 11px; }
.doc-row .nm { font-size: 13px; font-weight: 500; }
.doc-row .d { font-size: 11px; color: var(--ink-soft); }
.doc-row .lock { margin-left: auto; color: var(--ink-soft); font-size: 13px; }

.doc-add {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px; border: 1px dashed var(--line); border-radius: var(--r-soft);
  color: var(--teal); font-size: 13px; font-weight: 600; cursor: pointer;
}

/* ---------- Annotations panel ---------- */
.annot {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: 22px 24px;
}
.annot h2 { font-family: 'Lora', serif; font-weight: 500; font-size: 22px; color: var(--teal-deep); margin: 0 0 6px; }
.annot .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; line-height: 1.6; }
.annot h3 { font-size: 13px; margin: 0 0 4px; color: var(--teal-deep); font-weight: 600; }
.annot p { font-size: 12.5px; color: var(--ink-soft); line-height: 1.65; margin: 0 0 10px; }
.annot .step-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.annot .step {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px;
  padding: 10px 12px; background: var(--bone-warm); border-radius: var(--r-soft);
  border-left: 3px solid var(--bone-warm);
  transition: background .15s, border-color .15s;
}
.annot .step.is-active { background: rgba(194,114,74,0.08); border-left-color: var(--sienna); }
.annot .step .num { font-family: 'Lora', serif; font-size: 16px; font-weight: 600; color: var(--teal); }
.annot .step .b { font-weight: 600; font-size: 13px; color: var(--ink); }
.annot .step .m { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.55; }

.annot .reset {
  margin-top: 18px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-soft); cursor: pointer;
}
.annot .reset:hover { color: var(--teal); }

/* ---------- Footer notes ---------- */
.foot-notes {
  margin-top: 36px; padding: 22px 24px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-card);
}
.foot-notes h3 { font-family: 'Lora', serif; font-weight: 500; font-size: 19px; color: var(--teal-deep); margin: 0 0 14px; }
.foot-notes .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

// ---------------- Free-text keyword inference (stub for backend) ----------------
// Maps loose phrases in RU + EN to a situation id. The Home matcher uses this
// to set the inferred situation after a fake ~900 ms backend round-trip.
const KEYWORDS = {
  sleep:     /сон|спать|спал|бессонн|sleep|insomn/i,
  spine:     /спин|поясн|сустав|колен|шея|радикул|spine|back|joint|sciatic/i,
  postop:    /после операц|реабилит|восстанов|прооперир|операци|post.?op|surgery|surgical/i,
  stress:    /стресс|выгор|тревог|нерв|истощ|устал|stress|burn.?out|anxious|anxiety|fatigue/i,
  weight:    /вес|похуд|лишн|тучн|полнота|weight|lose|kg|lbs/i,
  longevity: /возраст|гормон|менопауз|старе|молод|longevity|aging|age|hormone/i,
  cardiac:   /сердц|давлен|гипертон|инфаркт|стенокард|cardiac|heart|blood pressure|hypertens/i,
};

const inferSituation = (text) => {
  if (!text) return null;
  for (const [k, re] of Object.entries(KEYWORDS)) {
    if (re.test(text)) return k;
  }
  return null;
};

// ---------------- App ----------------
function App() {
  const [lang, setLang]   = useState("ru");
  const [screen, setScreen] = useState("home");
  const [situation, setSituation] = useState("sleep");
  const [activeVenue, setActiveVenue] = useState(null);
  const [saved, setSaved] = useState(false);
  const t = COPY[lang];

  useEffect(() => {
    const html = document.getElementById("root-html") || document.documentElement;
    html.setAttribute("lang", lang);
  }, [lang]);

  const reset = () => { setScreen("home"); setSituation("sleep"); setActiveVenue(null); setSaved(false); };
  const openVenue = (v) => { setActiveVenue(v); setScreen("detail"); };
  const goHome = () => setScreen("home");
  const goSaved = () => { setSaved(true); setScreen("saved"); };

  const matched = useMemo(
    () => VENUES.filter(v => Object.prototype.hasOwnProperty.call(v.rationale, situation)),
    [situation]
  );

  return (
    <div className="page">
      <header className="page-head">
        <div>
          <div className="brand">
            <div className="brand-mark">W</div>
            <div>
              <div className="brand-name">WellHealth</div>
              <div className="brand-sub">{t.brand_sub}</div>
            </div>
          </div>
          <div className="page-meta" style={{ marginTop: 14 }}>{t.meta}</div>
        </div>
        <div className="lang-toggle" role="tablist">
          <button type="button" className={lang === "ru" ? "is-active" : ""} onClick={() => setLang("ru")}>RU</button>
          <button type="button" className={lang === "en" ? "is-active" : ""} onClick={() => setLang("en")}>EN</button>
        </div>
      </header>

      <div className="legend">
        <b>{t.legend_palette}</b> {t.legend_palette_v}{" "}
        <b>{t.legend_type}</b> {t.legend_type_v}{" "}
        <b>{t.legend_inter}</b> {t.legend_inter_v}
      </div>

      <div className="stage">
        <div className="phone-wrap">
          <div className="phone">
            <div className="screen">
              {screen === "home"    && <Home    t={t} lang={lang} situation={situation} setSituation={setSituation} matched={matched} openVenue={openVenue} goBrowse={() => setScreen("browse")} setScreen={setScreen}/>}
              {screen === "detail"  && <Detail  t={t} lang={lang} venue={activeVenue} situation={situation} goBack={goHome} goSaved={goSaved} setScreen={setScreen}/>}
              {screen === "saved"   && <Saved   t={t} lang={lang} venue={activeVenue} goBack={() => setScreen("detail")} setScreen={setScreen}/>}
              {screen === "browse"  && <Browse  t={t} lang={lang} situation={situation} setSituation={setSituation} openVenue={openVenue} setScreen={setScreen}/>}
              {screen === "profile" && <Profile t={t} lang={lang} situation={situation} setScreen={setScreen}/>}
            </div>
          </div>
        </div>

        <Annotations t={t} screen={screen} reset={reset}/>
      </div>

      <FootNotes t={t}/>
    </div>
  );
}

// ---------------- Phone shells ----------------
function StatusBar() {
  return (
    <div className="status-bar">
      <span>9:41</span>
      <span className="right"><span className="dot"/><span className="dot"/><span className="dot"/></span>
    </div>
  );
}
function NavTop({ left, title, right }) {
  return (
    <div className="nav-top">
      <div className="icon-btn" onClick={left && left.onClick} style={{ visibility: left ? "visible" : "hidden" }}>{left ? left.glyph : "≡"}</div>
      <div className="title">{title}</div>
      <div className="icon-btn" onClick={right && right.onClick} style={{ visibility: right ? "visible" : "hidden" }}>{right ? right.glyph : "⌕"}</div>
    </div>
  );
}
function NavBottom({ t, screen, setScreen }) {
  const items = [
    { id: "home",    glyph: "⌂", lbl: t.nav_home,    target: "home" },
    { id: "browse",  glyph: "⌕", lbl: t.nav_search,  target: "browse" },
    { id: "saved",   glyph: "♥", lbl: t.nav_saved,   target: "saved" },
    { id: "profile", glyph: "◯", lbl: t.nav_profile, target: "profile" },
  ];
  return (
    <div className="nav-bottom">
      {items.map(it => (
        <div
          key={it.id}
          className={"nb-item" + ((screen === it.target || (it.id === "home" && screen === "detail")) ? " is-active" : "")}
          onClick={() => setScreen(it.target)}
        >
          <div className="nb-glyph">{it.glyph}</div>
          <span>{it.lbl}</span>
        </div>
      ))}
    </div>
  );
}

// ---------------- HOME / matcher ----------------
function Home({ t, lang, situation, setSituation, matched, openVenue, goBrowse, setScreen }) {
  const top = matched.slice(0, 3);
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [didMatch, setDidMatch] = useState(false);

  // Stubbed backend call: send query, infer a situation, mark searched.
  const handleSubmit = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (!query.trim() || loading) return;
    setLoading(true);
    setTimeout(() => {
      const inferred = inferSituation(query);
      if (inferred) {
        setSituation(inferred);
        setDidMatch(true);
      } else {
        setDidMatch(false);
      }
      setSearched(true);
      setLoading(false);
    }, 900);
  };

  const showResults = searched && didMatch && !loading;
  const showNoMatch = searched && !didMatch && !loading;

  return (
    <React.Fragment>
      <StatusBar/>
      <NavTop title={t.home_title}/>
      <div className="scroll">
        <div className="greet-block">
          <div className="greet">{t.greet} <span className="nm">{t.user_first}</span></div>
          <div className="greet-sub">{t.greet_sub}</div>
        </div>

        <div className="matcher-card">
          <div className="matcher-q">{t.matcher_q}</div>
          <form className="text-input-row" onSubmit={handleSubmit}>
            <input
              type="text"
              className="text-input"
              placeholder={t.input_ph}
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              disabled={loading}
            />
            <button
              type="submit"
              className="submit-btn submit-btn--text"
              disabled={loading || !query.trim()}
            >
              {loading ? <span className="loader-dot"/> : t.submit_a}
            </button>
          </form>
          {loading && <div className="loading-line">{t.loading}</div>}
          {showNoMatch && <div className="no-match">{t.no_match}</div>}
        </div>

        {showResults && (
          <React.Fragment>
            <div className="section-h">
              <span className="lbl">{SITUATIONS.find(s => s.id === situation)[lang]} · {top.length}</span>
              <a onClick={goBrowse}>{t.show_all}</a>
            </div>
            {top.map(v => (
              <div className="match-card" key={v.id} onClick={() => openVenue(v)}>
                <div className={"thumb " + v.thumb}>{v.name[lang].charAt(0)}</div>
                <div>
                  <div className="name">{v.name[lang]}</div>
                  <div className="why">{v.rationale[situation][lang]}</div>
                  <div className="price-row">
                    <span className="loc">{v.loc[lang]}</span>
                    <span className="price">{t.from} €{v.price.toLocaleString(lang === "ru" ? "ru-RU" : "en-US")}</span>
                  </div>
                </div>
              </div>
            ))}
          </React.Fragment>
        )}
      </div>
      <NavBottom t={t} screen="home" setScreen={setScreen}/>
    </React.Fragment>
  );
}

// ---------------- DETAIL ----------------

  if (!venue) return null;
  const det = VENUE_DETAIL[venue.id] || {};
  const ratKeys = Object.keys(venue.rationale);
  return (
    <React.Fragment>
      <div className={"det-hero thumb " + venue.thumb}>
        <div className="nav left" onClick={goBack}>←</div>
        <div className="nav right" onClick={goSaved}>♥</div>
      </div>
      <div className="det-title-block">
        <div className="name">{venue.name[lang]}</div>
        <div className="loc">{venue.loc[lang]}</div>
        <div className="fact-table">
          <div className="fact-row"><div className="k">{t.fact_stay}</div>    <div className="v">{(det.stay && det.stay[lang]) || "—"}</div></div>
          <div className="fact-row"><div className="k">{t.fact_therapy}</div> <div className="v">{(det.therapy && det.therapy[lang]) || "—"}</div></div>
          <div className="fact-row"><div className="k">{t.fact_price}</div>   <div className="v">{t.from} €{venue.price.toLocaleString(lang === "ru" ? "ru-RU" : "en-US")} · {t.per}</div></div>
          <div className="fact-row"><div className="k">{t.fact_lang}</div>    <div className="v">{(det.lang && det.lang[lang]) || "—"}</div></div>
        </div>
      </div>
      <div className="scroll">
        <div className="why-panel">
          <div className="eyebrow">{t.why_eb}</div>
          <h4>{t.why_h}</h4>
          <ul className="why-list">
            {ratKeys.map(k => (
              <li key={k}><b>{SITUATIONS.find(s => s.id === k)[lang]}.</b> {venue.rationale[k][lang]}</li>
            ))}
          </ul>
          {det.cons && <div className="why-cons">{det.cons[lang]}</div>}
        </div>
        <div className="cta-stack">
          <button className="btn" onClick={goSaved}>{t.cta_save}</button>
          <button className="btn ghost">{t.cta_open}</button>
        </div>
      </div>
      <NavBottom t={t} screen="detail" setScreen={setScreen}/>
    </React.Fragment>
  );
}

// ---------------- BROWSE ----------------
function Browse({ t, lang, situation, setSituation, openVenue, setScreen }) {
  const filtered = situation
    ? VENUES.filter(v => Object.prototype.hasOwnProperty.call(v.rationale, situation))
    : VENUES;
  return (
    <React.Fragment>
      <StatusBar/>
      <NavTop title={t.browse_title}/>
      <div className="scroll">
        <div className="search-bar">
          <span className="ic">⌕</span>
          <span className="input">{t.search_ph}</span>
        </div>
        <div className="filter-row">
          {SITUATIONS.map(s => (
            <button
              type="button"
              key={s.id}
              className={"s-chip" + (s.id === situation ? " is-active" : "")}
              onClick={() => setSituation(s.id)}
            >
              {s[lang]}
            </button>
          ))}
        </div>
        {filtered.map(v => {
          const conds = Object.keys(v.rationale).map(k => SITUATIONS.find(s => s.id === k));
          return (
            <div className="browse-card" key={v.id} onClick={() => openVenue(v)}>
              <div className={"thumb " + v.thumb}>{v.name[lang].charAt(0)}</div>
              <div>
                <div className="name">{v.name[lang]}</div>
                <div className="loc">{v.loc[lang]}</div>
                <div className="price">{t.from} €{v.price.toLocaleString(lang === "ru" ? "ru-RU" : "en-US")}</div>
                <div className="tags">
                  {conds.map(c => <span key={c.id} className="tag">{c[lang]}</span>)}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <NavBottom t={t} screen="browse" setScreen={setScreen}/>
    </React.Fragment>
  );
}

// ---------------- Annotations panel ----------------
function Annotations({ t, screen, reset }) {
  const steps = [
    { id: "home",    b: t.annot_step1_b, m: t.annot_step1_m, screens: ["home"] },
    { id: "detail",  b: t.annot_step2_b, m: t.annot_step2_m, screens: ["detail"] },
    { id: "saved",   b: t.annot_step3_b, m: t.annot_step3_m, screens: ["saved"] },
    { id: "browse",  b: t.annot_step4_b, m: t.annot_step4_m, screens: ["browse"] },
    { id: "profile", b: t.annot_step5_b, m: t.annot_step5_m, screens: ["profile"] },
  ];
  return (
    <div className="annot">
      <h2>{t.annot_title}</h2>
      <div className="sub">{t.annot_sub}</div>
      <div className="step-list">
        {steps.map((s, i) => (
          <div key={s.id} className={"step" + (s.screens.includes(screen) ? " is-active" : "")}>
            <div className="num">{["I","II","III","IV","V"][i]}</div>
            <div>
              <div className="b">{s.b}</div>
              <div className="m">{s.m}</div>
            </div>
          </div>
        ))}
      </div>
      <a className="reset" onClick={reset}>{t.reset}</a>
    </div>
  );
}
