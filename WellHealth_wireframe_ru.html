<!DOCTYPE html>
<html lang="ru" id="root-html">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>WellHealth · Dr. Healthman</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet"/>

<style>
:root {
  --teal:        #1B4D54;
  --teal-deep:   #103942;
  --teal-soft:   #2D6770;
  --sienna:      #C2724A;
  --sienna-soft: #DDA181;
  --sienna-ink:  #7A4426;
  --bone:        #F4EFE4;
  --bone-warm:   #EBE3D2;
  --surface:     #FFFFFF;
  --ink:         #1F262B;
  --ink-soft:    #6B7378;
  --line:        #E2DBC9;
  --danger:      #8B3A2F;
  --shadow-sm:   0 4px 14px rgba(27, 77, 84, 0.08);
  --shadow-md:   0 10px 30px rgba(27, 77, 84, 0.12);
  --shadow-lg:   0 24px 60px rgba(27, 77, 84, 0.20);
  --r-card: 14px;
  --r-soft: 10px;
  --r-pill: 999px;
}
*,*::before,*::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  background: var(--bone);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; }
a { color: inherit; text-decoration: none; }

#root { height: 100%; }

/* ---------------- App shell ---------------- */
.app {
  height: 100%;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  background: var(--bone);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
@media (min-width: 720px) {
  .app { max-width: 760px; box-shadow: 0 0 80px rgba(27,77,84,0.08); }
}

/* The whole window is just chat. The stage holds the thread; overlays
   (venue card, profile sheet) float on top without displacing the thread. */
.stage {
  flex: 1;
  position: relative;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------------- Chat ---------------- */
.chat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 24px 18px 18px;
  display: flex;
  flex-direction: column;
  /* Keep messages glued to the composer so an empty conversation feels
     like a clean room rather than a wall of empty canvas. */
  justify-content: flex-end;
}
.chat-scroll::-webkit-scrollbar { width: 5px; }
.chat-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.chat-thread {
  display: flex; flex-direction: column;
  gap: 10px;
  padding-bottom: 4px;
}

/* Bubbles */
.bubble {
  max-width: 86%;
  padding: 11px 14px;
  border-radius: 16px;
  font-size: 14.5px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.bubble.assistant {
  background: var(--surface);
  border: 1px solid var(--line);
  border-bottom-left-radius: 6px;
  align-self: flex-start;
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(27,77,84,0.05);
}
.bubble.user {
  background: var(--teal);
  color: var(--bone);
  border-bottom-right-radius: 6px;
  align-self: flex-end;
}
.bubble.assistant b { color: var(--teal-deep); font-weight: 600; }

.typing-bubble {
  align-self: flex-start;
  display: flex; gap: 4px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  border-bottom-left-radius: 6px;
}
.typing-bubble span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ink-soft);
  animation: ldot 0.9s infinite ease-in-out;
}
.typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
@keyframes ldot {
  0%, 100% { opacity: 0.3; transform: scale(0.7); }
  50%      { opacity: 1;   transform: scale(1.2); }
}

/* Suggestion chips inside the thread */
.suggest-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  align-self: flex-start;
  max-width: 100%;
}
.suggest-chip {
  padding: 8px 13px;
  border: 1px solid var(--teal-soft);
  background: rgba(45,103,112,0.06);
  color: var(--teal-deep);
  border-radius: var(--r-pill);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.suggest-chip:hover { background: var(--teal); color: var(--bone); border-color: var(--teal); }
.suggest-chip:disabled { opacity: 0.5; cursor: not-allowed; }

/* Venue list inside the chat (top-3 recommendations) */
.chat-venue-stack {
  display: flex; flex-direction: column; gap: 7px;
  width: 100%;
  align-self: flex-start;
}
.chat-venue-card {
  display: grid; grid-template-columns: 48px 1fr;
  gap: 11px;
  padding: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-soft);
  cursor: pointer;
  transition: transform .12s, box-shadow .15s, border-color .12s;
}
.chat-venue-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); border-color: var(--teal-soft); }
.chat-venue-card .thumb {
  width: 48px; height: 48px; border-radius: 9px;
  display: grid; place-items: center;
  font-family: 'Lora', serif; font-size: 18px; font-weight: 600; color: var(--bone);
}
.chat-venue-card .name { font-weight: 600; font-size: 13.5px; line-height: 1.25; }
.chat-venue-card .why { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }
.chat-venue-card .meta { font-size: 11px; color: var(--ink-soft); margin-top: 5px; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.chat-venue-card .meta .price { font-family: 'Lora', serif; font-weight: 600; color: var(--teal-deep); font-size: 13px; }

/* Inline reservation form + confirm card (unchanged from prior wireframe) */
.reserve-form {
  background: var(--surface);
  border: 1px solid var(--sienna);
  border-left: 4px solid var(--sienna);
  border-radius: var(--r-card);
  padding: 12px 13px 13px;
  display: flex; flex-direction: column; gap: 10px;
  align-self: flex-start;
  width: 100%;
}
.reserve-form .ttl {
  font-family: 'Lora', serif;
  font-size: 14.5px; font-weight: 600; color: var(--teal-deep);
  line-height: 1.25;
}
.reserve-form label {
  font-size: 10.5px;
  color: var(--ink-soft);
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  display: block;
  margin-bottom: 4px;
}
.reserve-field {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-soft);
  background: var(--bone);
  font: inherit;
  font-size: 13px;
  color: var(--ink);
}
.reserve-field:focus { border-color: var(--teal); outline: none; background: var(--surface); }
.people-row { display: flex; align-items: center; gap: 12px; }
.people-row button {
  width: 32px; height: 32px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--r-soft);
  font-size: 16px; font-weight: 600;
  color: var(--teal);
  cursor: pointer;
  display: grid; place-items: center;
}
.people-row button:disabled { opacity: 0.4; cursor: not-allowed; }
.people-row .count {
  font-family: 'Lora', serif;
  font-size: 18px; font-weight: 600;
  min-width: 18px; text-align: center;
}
.reserve-submit {
  background: var(--teal);
  color: var(--bone);
  padding: 11px;
  border: 0;
  border-radius: var(--r-soft);
  font: inherit; font-weight: 600; font-size: 13.5px;
  cursor: pointer;
  transition: background .12s;
}
.reserve-submit:hover { background: var(--teal-deep); }
.reserve-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.confirm-card {
  background: var(--surface);
  border: 1px solid var(--teal);
  border-left: 4px solid var(--teal);
  border-radius: var(--r-card);
  padding: 13px;
  display: flex; flex-direction: column; gap: 7px;
  align-self: flex-start;
  width: 100%;
}
.confirm-card .badge {
  align-self: flex-start;
  font-size: 9.5px; letter-spacing: 1.4px; font-weight: 700;
  text-transform: uppercase;
  background: var(--teal); color: var(--bone);
  padding: 3px 9px; border-radius: var(--r-pill);
}
.confirm-card .ttl {
  font-family: 'Lora', serif;
  font-size: 16px; font-weight: 600;
  color: var(--teal-deep); line-height: 1.2;
}
.confirm-card .row { font-size: 12.5px; color: var(--ink); }
.confirm-card .row b { color: var(--teal-deep); font-weight: 600; }
.confirm-card .ref {
  font-size: 11.5px; color: var(--ink-soft);
  font-family: 'Lora', serif;
  letter-spacing: 0.6px;
}

/* ---------------- Bottom dock ---------------- */
/* Two avatars + a composer "bubble" between them. The composer visually
   emerges from the user's avatar on the right (speech-bubble tail) — the
   doctor's avatar on the left is the symmetric anchor. */
.dock {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 56px 1fr 56px;
  gap: 10px;
  align-items: end;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: transparent;
  position: relative;
  z-index: 4;
}

/* Persistent avatars at the bottom corners */
.avatar {
  width: 56px; height: 56px;
  border-radius: 50%;
  display: grid; place-items: center;
  cursor: pointer;
  border: 0;
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: transform .12s, box-shadow .15s;
}
.avatar:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.avatar.doctor {
  background: linear-gradient(155deg, var(--teal-soft) 0%, var(--teal-deep) 100%);
  color: var(--bone);
}
.avatar.user {
  background: linear-gradient(155deg, var(--sienna-soft) 0%, var(--sienna) 100%);
  color: var(--bone);
  font-family: 'Lora', serif;
  font-size: 22px;
  font-weight: 600;
}
.avatar svg { width: 28px; height: 28px; display: block; }
.avatar .name-tag {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 9.5px;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-soft);
  white-space: nowrap;
  pointer-events: none;
}

/* The composer is shaped like a chat bubble with a tail pointing right
   toward the user's avatar — it reads as "the user's input bubble". */
.composer-bubble {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  border-bottom-right-radius: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px 6px 14px;
  min-height: 48px;
  box-shadow: 0 2px 10px rgba(27,77,84,0.06);
  transition: border-color .15s, box-shadow .15s;
}
.composer-bubble:focus-within {
  border-color: var(--teal-soft);
  box-shadow: 0 4px 18px rgba(27,77,84,0.10);
}
/* Speech-bubble tail: a tiny rotated square at the right edge that visually
   stitches the bubble to the user's avatar. */
.composer-bubble::after {
  content: "";
  position: absolute;
  right: -7px; bottom: 6px;
  width: 14px; height: 14px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  transform: rotate(-45deg);
  border-bottom-right-radius: 3px;
}
.text-input {
  flex: 1; min-width: 0;
  border: 0; outline: 0;
  background: transparent;
  font: inherit;
  font-size: 14.5px;
  color: var(--ink);
  padding: 6px 0;
}
.text-input::placeholder { color: var(--ink-soft); }
.text-input:disabled { opacity: 0.6; cursor: not-allowed; }
.send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 0;
  background: var(--teal);
  color: var(--bone);
  cursor: pointer;
  display: grid; place-items: center;
  transition: background .12s, transform .12s, opacity .12s;
  flex: 0 0 auto;
}
.send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.send-btn:not(:disabled):hover { background: var(--teal-deep); transform: scale(1.04); }
.send-btn svg { width: 16px; height: 16px; display: block; }
.send-btn .loader-dot {
  display: block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--bone);
  animation: ldot 0.9s infinite ease-in-out;
}

/* ---------------- Floating venue card overlay ---------------- */
/* The card "hovers" above the chat — chat is visible underneath through a
   gentle fade, and the composer at the bottom keeps working with the card
   as additional context. */
.venue-overlay-wrap {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}
.venue-overlay-backdrop {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    rgba(244,239,228,0.55) 0%,
    rgba(244,239,228,0.10) 60%,
    rgba(244,239,228,0) 100%);
  pointer-events: none;
}
.venue-overlay {
  position: absolute;
  left: 16px; right: 16px;
  top: 16px;
  max-height: 60%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  pointer-events: auto;
  animation: cardIn .22s ease-out;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(-12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Compact header — thumbnail, name, location and close all live here. */
.venue-overlay .venue-head {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 10px 10px 12px;
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
  background: var(--surface);
}
.venue-overlay .venue-head-thumb {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: grid; place-items: center;
  font-family: 'Lora', serif;
  font-size: 16px; font-weight: 600;
  color: var(--bone);
  flex: 0 0 auto;
}
.venue-overlay .venue-head-text {
  flex: 1; min-width: 0;
}
.venue-overlay .card-name {
  font-family: 'Lora', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--teal-deep);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.venue-overlay .card-loc {
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.venue-overlay .card-close {
  flex: 0 0 auto;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--bone-warm);
  border: 0;
  font-size: 18px; line-height: 1;
  color: var(--ink-soft);
  cursor: pointer;
  display: grid; place-items: center;
  font-weight: 500;
  transition: background .12s, color .12s, transform .12s;
}
.venue-overlay .card-close:hover {
  background: var(--bone);
  color: var(--teal-deep);
  transform: scale(1.05);
}

.venue-overlay .card-body {
  padding: 12px 14px 14px;
  overflow-y: auto;
  flex: 1 1 auto;
  min-height: 0;
  display: flex; flex-direction: column;
}
.venue-overlay .card-body::-webkit-scrollbar { width: 4px; }
.venue-overlay .card-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

.venue-overlay .fact-table {
  border: 1px solid var(--line);
  border-radius: var(--r-soft);
  overflow: hidden;
  background: var(--bone-warm);
}
.venue-overlay .fact-row {
  display: flex; padding: 5px 10px; gap: 8px;
  border-bottom: 1px solid var(--line);
  font-size: 11.5px;
}
.venue-overlay .fact-row:last-child { border-bottom: 0; }
.venue-overlay .fact-row .k {
  color: var(--ink-soft);
  flex: 0 0 88px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
  font-size: 9.5px;
  padding-top: 1px;
}
.venue-overlay .fact-row .v {
  color: var(--ink);
  font-weight: 500;
}
.venue-overlay .why-panel {
  margin-top: 10px;
  border: 1px solid var(--sienna);
  background: rgba(194,114,74,0.06);
  border-radius: var(--r-soft);
  padding: 9px 11px;
}
.venue-overlay .why-panel .eyebrow {
  font-size: 9px;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  color: var(--sienna-ink);
  font-weight: 700;
  margin-bottom: 6px;
}
.venue-overlay .why-list {
  margin: 0;
  padding-inline-start: 15px;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--ink);
}
.venue-overlay .why-list li { margin-bottom: 3px; }
.venue-overlay .why-cons {
  font-size: 10.5px;
  color: var(--danger);
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid rgba(139,58,47,0.2);
}
.venue-overlay .reserve-cta {
  margin-top: 10px;
}
.venue-overlay .reserve-cta button {
  width: 100%;
  padding: 10px;
  background: var(--sienna);
  color: var(--bone);
  border: 0;
  border-radius: var(--r-soft);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background .12s;
}
.venue-overlay .reserve-cta button:hover { background: var(--sienna-ink); }

/* hero gradient backgrounds (re-used from prior wireframe) */
.thumb.lans      { background: linear-gradient(135deg, #A8B2A8 0%, #3F4A47 100%); }
.thumb.bad-ragaz { background: linear-gradient(135deg, #7E8B8E 0%, #3A4549 100%); }
.thumb.sha       { background: linear-gradient(135deg, #C5B8A3 0%, #7A6D56 100%); }
.thumb.karlovy   { background: linear-gradient(135deg, #B89970 0%, #5C4220 100%); }
.thumb.marianske { background: linear-gradient(135deg, #B0A488 0%, #5C4F33 100%); }
.thumb.heviz     { background: linear-gradient(135deg, #8AA398 0%, #3D5447 100%); }
.thumb.rixos     { background: linear-gradient(135deg, #C29066 0%, #6E4D2E 100%); }
.thumb.atmanjai  { background: linear-gradient(135deg, #97A88E 0%, #4A5A40 100%); }
.thumb.kislovodsk{ background: linear-gradient(135deg, #9DA67A 0%, #4F5536 100%); }
.thumb.velingrad { background: linear-gradient(135deg, #A38670 0%, #5A4231 100%); }
.thumb.altay     { background: linear-gradient(135deg, #6F8B82 0%, #2D423B 100%); }
.thumb.heritance { background: linear-gradient(135deg, #B8A47C 0%, #6B5832 100%); }
.thumb.terme     { background: linear-gradient(135deg, #8FA6A2 0%, #3F5650 100%); }

/* ---------------- Profile sheet ---------------- */
.sheet-scrim {
  position: absolute;
  inset: 0;
  background: rgba(16, 57, 66, 0.36);
  z-index: 5;
  animation: scrimIn .18s ease-out;
}
@keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }

.profile-sheet {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  z-index: 6;
  background: var(--bone);
  border-top-left-radius: 22px;
  border-top-right-radius: 22px;
  box-shadow: 0 -16px 40px rgba(16,57,66,0.20);
  display: flex; flex-direction: column;
  max-height: 88%;
  animation: sheetIn .25s cubic-bezier(.2,.8,.25,1);
}
@keyframes sheetIn {
  from { transform: translateY(20%); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}
.sheet-handle {
  align-self: center;
  width: 38px; height: 4px;
  border-radius: 2px;
  background: var(--line);
  margin: 8px 0 4px;
}
.sheet-head {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 18px 14px;
  border-bottom: 1px solid var(--line);
}
.sheet-head .avatar.user {
  width: 48px; height: 48px;
  font-size: 18px;
  cursor: default;
}
.sheet-head .id-block { flex: 1; min-width: 0; }
.sheet-head .id-name {
  font-family: 'Lora', serif;
  font-weight: 600;
  font-size: 17px;
  color: var(--teal-deep);
}
.sheet-head .id-sub {
  font-size: 11.5px;
  color: var(--ink-soft);
  margin-top: 1px;
}
.sheet-head .sheet-close {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 18px;
  color: var(--ink-soft);
  cursor: pointer;
  display: grid; place-items: center;
  transition: background .12s, color .12s;
}
.sheet-head .sheet-close:hover { background: var(--bone-warm); color: var(--teal-deep); }

.sheet-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px 24px;
}
.profile-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 14px;
  margin-bottom: 12px;
}
.profile-card .lbl {
  font-size: 10.5px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 700;
}
.profile-card .lbl + .v {
  margin-top: 6px;
  font-size: 14.5px;
  font-weight: 500;
}
.profile-card .v.tags {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 8px;

// ---------------- App ----------------
function App() {
  const [lang, setLang]                   = useState("ru");
  const [situation, setSituation]         = useState("sleep");
  const [activeVenueId, setActiveVenueId] = useState(null);
  const [profileOpen, setProfileOpen]     = useState(false);
  const t = COPY[lang];

  useEffect(() => {
    document.documentElement.setAttribute("lang", lang);
  }, [lang]);

  const openVenue  = (v) => setActiveVenueId(v.id);
  const closeVenue = ()  => setActiveVenueId(null);

  const openNotes = () => {
    if (typeof window !== "undefined" && window.open) {
      window.open("notes_ru.html", "_blank", "noopener");
    }
  };

  return (
    <div className="app">
      <Stage
        t={t} lang={lang}
        situation={situation} setSituation={setSituation}
        activeVenueId={activeVenueId}
        openVenue={openVenue} closeVenue={closeVenue}
        openProfile={() => setProfileOpen(true)}
      />
      {profileOpen && (
        <ProfileSheet
          t={t} lang={lang} setLang={setLang}
          situation={situation} setSituation={setSituation}
          onClose={() => setProfileOpen(false)}
          openNotes={openNotes}
        />
      )}
    </div>
  );
}

// ---------------- Stage: chat thread + dock + venue overlay ----------------
function Stage({ t, lang, situation, setSituation, activeVenueId, openVenue, closeVenue, openProfile }) {
  const initialThread = () => ([
    { id: 1, role: "a", kind: "text",  body: t.chat_welcome },
    { id: 2, role: "a", kind: "chips", group: "situation", chips: t.chat_situ_chips },
  ]);
  const [thread,    setThread]    = useState(initialThread);
  const [phase,     setPhase]     = useState("await_situation");
  const [query,     setQuery]     = useState("");
  const [pending,   setPending]   = useState(false);
  const [topVenues, setTopVenues] = useState([]);
  const idRef = useRef(2);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [thread, pending]);

  useEffect(() => {
    setThread(initialThread());
    setPhase("await_situation");
    setTopVenues([]);
    setQuery("");
    setPending(false);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [lang]);

  const nextId = () => { idRef.current += 1; return idRef.current; };
  const stripChips = (msgs) => msgs.filter(m => m.kind !== "chips");
  const append = (msgs, ...newOnes) => [...msgs, ...newOnes.map(m => ({ id: nextId(), ...m }))];

  const userTurn = (text, replyFn) => {
    setThread(prev => append(stripChips(prev), { role: "u", kind: "text", body: text }));
    setPending(true);
    setTimeout(() => {
      setPending(false);
      setThread(prev => replyFn(prev));
    }, 700);
  };

  // ----- Conversation handlers -----
  const onSituation = (text) => {
    const inferred = inferSituation(text);
    if (inferred) {
      setSituation(inferred);
      setPhase("await_length");
    }
    userTurn(text, (prev) => {
      if (!inferred) {
        return append(prev,
          { role: "a", kind: "text",  body: t.chat_no_match },
          { role: "a", kind: "chips", group: "situation", chips: t.chat_situ_chips },
        );
      }
      const label = SITUATIONS.find(s => s.id === inferred)[lang].toLowerCase();
      return append(prev,
        { role: "a", kind: "text",  body: t.chat_ack(label) },
        { role: "a", kind: "text",  body: t.chat_q_length },
        { role: "a", kind: "chips", group: "length", chips: t.chat_length_chips },
      );
    });
  };

  const onLength = (text) => {
    setPhase("await_region");
    userTurn(text, (prev) => append(prev,
      { role: "a", kind: "text",  body: t.chat_q_region },
      { role: "a", kind: "chips", group: "region", chips: t.chat_region_chips },
    ));
  };

  const onRegion = (text) => {
    const top = VENUES
      .filter(v => Object.prototype.hasOwnProperty.call(v.rationale, situation))
      .slice(0, 3);
    setTopVenues(top);
    setPhase("qa");
    userTurn(text, (prev) => append(prev,
      { role: "a", kind: "text",   body: t.chat_recommend_intro },
      { role: "a", kind: "venues", venues: top },
      { role: "a", kind: "chips",  group: "qa", chips: buildQaChips() },
    ));
  };

  const buildQaChips = () => ([
    { label: t.qa_prices_l, kind: "qa", id: "prices" },
    { label: t.qa_lang_l,   kind: "qa", id: "lang" },
    { label: t.qa_when_l,   kind: "qa", id: "when" },
    { label: t.qa_food_l,   kind: "qa", id: "food" },
    { label: t.qa_diff_l,   kind: "qa", id: "diff" },
  ]);

  const qaAnswer = (id, top) => {
    if (id === "prices") {
      const list = top.map(v => `${v.name[lang]} — ${t.from} €${v.price.toLocaleString(lang === "ru" ? "ru-RU" : "en-US")}`).join("; ");
      return `${t.qa_prices_intro}: ${list}.`;
    }
    if (id === "lang") {
      const list = top.map(v => {
        const det = VENUE_DETAIL[v.id];
        const ls  = det && det.lang ? det.lang[lang] : "—";
        return `${v.name[lang]}: ${ls}`;
      }).join(" · ");
      return `${t.qa_lang_intro}. ${list}.`;
    }
    if (id === "when") return t.qa_when_a;
    if (id === "food") return t.qa_food_a;
    if (id === "diff") {
      const list = top.map(v => {
        const firstKey = Object.keys(v.rationale)[0];
        return `${v.name[lang]} — ${v.rationale[firstKey][lang]}`;
      }).join(" ");
      return `${t.qa_diff_intro}. ${list}`;
    }
    return t.qa_default;
  };

  const onQA = (chip) => {
    userTurn(chip.label, (prev) => append(prev,
      { role: "a", kind: "text",  body: qaAnswer(chip.id, topVenues) },
      { role: "a", kind: "chips", group: "qa", chips: buildQaChips() },
    ));
  };

  const onReserveStart = (venue) => {
    setPhase("reserve_form");
    closeVenue();
    userTurn(t.chat_reserve_user(venue.name[lang]), (prev) => append(prev,
      { role: "a", kind: "text", body: t.chat_reserve_intro(venue.name[lang]) },
      { role: "a", kind: "form", venue },
    ));
  };

  const onReserveSubmit = (venue, dates, people) => {
    const slug = venue.id.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4) || "WELL";
    const ref  = `WH-20260504-${slug}`;
    setPhase("confirmed");
    userTurn(t.chat_reserve_confirmed_user(dates, people), (prev) => append(prev,
      { role: "a", kind: "text",    body: t.chat_reservation_done },
      { role: "a", kind: "confirm", venue, dates, people, ref },
      { role: "a", kind: "text",    body: t.chat_post_done },
    ));
  };

  const handleChip = (chip, group) => {
    if (pending) return;
    if (group === "situation")    onSituation(chip.text);
    else if (group === "length")  onLength(chip.text);
    else if (group === "region")  onRegion(chip.text);
    else if (group === "qa")      onQA(chip);
  };

  const handleSubmit = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (!query.trim() || pending) return;
    const text = query.trim();
    setQuery("");
    if (phase === "await_situation")     onSituation(text);
    else if (phase === "await_length")   onLength(text);
    else if (phase === "await_region")   onRegion(text);
    else if (phase === "qa") {
      userTurn(text, (prev) => append(prev,
        { role: "a", kind: "text",  body: t.qa_default },
        { role: "a", kind: "chips", group: "qa", chips: buildQaChips() },
      ));
    } else {
      userTurn(text, (prev) => append(prev,
        { role: "a", kind: "text", body: t.chat_post_done },
      ));
    }
  };

  const activeVenue = activeVenueId ? VENUES.find(v => v.id === activeVenueId) : null;
  const composerPh  = activeVenue ? t.input_ph_card(activeVenue.name[lang]) : t.input_ph;

  return (
    <React.Fragment>
      <div className="stage">
        <div className="chat-scroll" ref={scrollRef}>
          <div className="chat-thread">
            {thread.map((m) => {
              if (m.kind === "text") {
                return <div key={m.id} className={"bubble " + (m.role === "u" ? "user" : "assistant")}>{m.body}</div>;
              }
              if (m.kind === "chips") {
                return (
                  <div key={m.id} className="suggest-row">
                    {m.chips.map((c, j) => (
                      <button
                        key={j}
                        type="button"
                        className="suggest-chip"
                        onClick={() => handleChip(c, m.group)}
                        disabled={pending}
                      >
                        {c.label}
                      </button>
                    ))}
                  </div>
                );
              }
              if (m.kind === "venues") {
                return (
                  <div key={m.id} className="chat-venue-stack">
                    {m.venues.map(v => (
                      <div className="chat-venue-card" key={v.id} onClick={() => openVenue(v)}>
                        <div className={"thumb " + v.thumb}>{v.name[lang].charAt(0)}</div>
                        <div>
                          <div className="name">{v.name[lang]}</div>
                          <div className="why">{v.rationale[situation] ? v.rationale[situation][lang] : v.rationale[Object.keys(v.rationale)[0]][lang]}</div>
                          <div className="meta">
                            <span>{v.loc[lang]}</span>
                            <span className="price">{t.from} €{v.price.toLocaleString(lang === "ru" ? "ru-RU" : "en-US")}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                );
              }
              if (m.kind === "form") {
                return (
                  <ReservationForm
                    key={m.id}
                    t={t} lang={lang}
                    venue={m.venue}
                    disabled={phase !== "reserve_form" || pending}
                    onSubmit={(dates, people) => onReserveSubmit(m.venue, dates, people)}
                  />
                );
              }
              if (m.kind === "confirm") {
                return (
                  <div key={m.id} className="confirm-card">
                    <span className="badge">✓ {t.confirm_badge}</span>
                    <div className="ttl">{m.venue.name[lang]}</div>
                    <div className="row">{t.confirm_dates}: <b>{m.dates}</b></div>
                    <div className="row">{t.confirm_people}: <b>{m.people}</b></div>
                    <div className="ref">{t.confirm_ref}: {m.ref}</div>
                  </div>
                );
              }
              return null;
            })}
            {pending && (
              <div className="typing-bubble"><span/><span/><span/></div>
            )}
          </div>
        </div>

        {/* Floating venue overlay — chat keeps working underneath. */}
        {activeVenue && (
          <div className="venue-overlay-wrap">
            <div className="venue-overlay-backdrop"/>
            <VenueOverlay
              t={t} lang={lang}
              venue={activeVenue}
              onClose={closeVenue}
              onReserve={() => onReserveStart(activeVenue)}
            />
          </div>
        )}
      </div>

      <Dock
        t={t} lang={lang}
        query={query} setQuery={setQuery}
        pending={pending}
        onSubmit={handleSubmit}
        onProfile={openProfile}
        composerPh={composerPh}
      />
    </React.Fragment>
  );
}

// ---------------- Floating venue card ----------------
function VenueOverlay({ t, lang, venue, onClose, onReserve }) {
  const det = VENUE_DETAIL[venue.id] || {};
  const ratKeys = Object.keys(venue.rationale);
  return (
    <article className="venue-overlay" role="dialog" aria-label={venue.name[lang]}>
      <header className="venue-head">
        <div className={"venue-head-thumb thumb " + venue.thumb}>{venue.name[lang].charAt(0)}</div>
        <div className="venue-head-text">
          <div className="card-name">{venue.name[lang]}</div>
          <div className="card-loc">{venue.loc[lang]}</div>
        </div>
        <button type="button" className="card-close" onClick={onClose} aria-label={t.card_close} title={t.card_close}>×</button>
      </header>
      <div className="card-body">
        <div className="fact-table">
          <div className="fact-row"><div className="k">{t.fact_stay}</div>    <div className="v">{(det.stay && det.stay[lang]) || "—"}</div></div>
          <div className="fact-row"><div className="k">{t.fact_therapy}</div> <div className="v">{(det.therapy && det.therapy[lang]) || "—"}</div></div>
          <div className="fact-row"><div className="k">{t.fact_price}</div>   <div className="v">{t.from} €{venue.price.toLocaleString(lang === "ru" ? "ru-RU" : "en-US")} · {t.per}</div></div>
          <div className="fact-row"><div className="k">{t.fact_lang}</div>    <div className="v">{(det.lang && det.lang[lang]) || "—"}</div></div>
        </div>
        <div className="why-panel">
          <div className="eyebrow">{t.why_eb}</div>
          <ul className="why-list">
            {ratKeys.map(k => (
              <li key={k}><b>{SITUATIONS.find(s => s.id === k)[lang]}.</b> {venue.rationale[k][lang]}</li>
            ))}
          </ul>
          {det.cons && <div className="why-cons">{det.cons[lang]}</div>}
        </div>
        <div className="reserve-cta">
          <button type="button" onClick={onReserve}>{t.cta_reserve}</button>
        </div>
      </div>
    </article>
  );
}

// ---------------- Reservation form ----------------
function ReservationForm({ t, lang, venue, disabled, onSubmit }) {
  const [dates,  setDates]  = useState(t.reserve_dates_ph);
  const [people, setPeople] = useState(1);
  const submit = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (disabled || !dates.trim()) return;
    onSubmit(dates.trim(), people);
  };
  return (
    <form className="reserve-form" onSubmit={submit}>
      <div className="ttl">{t.reserve_title(venue.name[lang])}</div>
      <div>
        <label>{t.reserve_dates_l}</label>
        <input type="text" className="reserve-field" value={dates} onChange={(e) => setDates(e.target.value)} placeholder={t.reserve_dates_ph} disabled={disabled}/>
      </div>
      <div>
        <label>{t.reserve_people_l}</label>
        <div className="people-row">
          <button type="button" onClick={() => setPeople(p => Math.max(1, p - 1))} disabled={disabled || people <= 1}>−</button>
          <span className="count">{people}</span>
          <button type="button" onClick={() => setPeople(p => Math.min(6, p + 1))} disabled={disabled || people >= 6}>+</button>
        </div>
      </div>
      <button type="submit" className="reserve-submit" disabled={disabled || !dates.trim()}>{t.reserve_submit}</button>
    </form>
  );
}

// ---------------- Bottom dock: doctor avatar · composer · user avatar ----------------
function Dock({ t, lang, query, setQuery, pending, onSubmit, onProfile, composerPh }) {
  return (
    <div className="dock">
      <button
        type="button"
        className="avatar doctor"
        title={t.doctor_name}
        aria-label={t.doctor_name}
      >
        <DoctorGlyph/>
      </button>

      <form className="composer-bubble" onSubmit={onSubmit}>
        <input
          type="text"
          className="text-input"
          placeholder={composerPh}
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          disabled={pending}
        />
        <button type="submit" className="send-btn" disabled={pending || !query.trim()} aria-label="Send">
          {pending ? <span className="loader-dot"/> : <ArrowUpGlyph/>}
        </button>
      </form>

      <button
        type="button"
        className="avatar user"
        onClick={onProfile}
        title={t.user_first}
        aria-label={t.profile_title}
      >
        {t.user_initial}
      </button>
    </div>
  );
}

  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
