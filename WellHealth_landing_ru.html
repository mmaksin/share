<!DOCTYPE html>
<html lang="ru" id="root-html">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WellHealth · Подбор оздоровительной поездки по ситуации</title>
<meta name="description" content="WellHealth подбирает санатории для оздоровления и восстановления по вашей ситуации — на клинической базе знаний, не на отзывах."/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet"/>

<style>
/* WellHealth · RU landing
   Same teal + sienna + bone palette as the premium variant — brand reads as one family. */

:root {
  --teal:        #1B4D54;
  --teal-deep:   #103942;
  --teal-soft:   #2D6770;
  --sienna:      #C2724A;
  --sienna-soft: #DDA181;
  --sienna-ink:  #7A4426;
  --bone:        #F4EFE4;
  --bone-warm:   #EBE3D2;
  --surface:     #FFFFFF;
  --ink:         #1F262B;
  --ink-soft:    #6B7378;
  --line:        #E2DBC9;
  --danger:      #8B3A2F;
  --shadow-sm:   0 4px 14px rgba(27, 77, 84, 0.08);
  --shadow-md:   0 10px 30px rgba(27, 77, 84, 0.12);
  --shadow-lg:   0 30px 60px rgba(27, 77, 84, 0.18);
  --radius-card: 12px;
  --radius-soft: 10px;
  --radius-pill: 999px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

body {
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background:
    radial-gradient(1400px 700px at 5% -10%, #fbf6ec 0%, transparent 60%),
    radial-gradient(1100px 600px at 110% 110%, #e6efef 0%, transparent 60%),
    var(--bone);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; }

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--sienna-ink);
  font-weight: 700;
}
.serif {
  font-family: 'Lora', serif;
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: 0.1px;
}
h1.serif { font-size: clamp(36px, 5.2vw, 56px); margin: 0; }
h2.serif { font-size: clamp(26px, 3.4vw, 40px); margin: 0; }
h3.serif { font-size: 22px; margin: 0; }
.lede { font-size: 16.5px; color: var(--ink-soft); line-height: 1.65; max-width: 60ch; }
.body-soft { color: var(--ink-soft); font-size: 14px; line-height: 1.65; }

/* ---------- Header ---------- */
.site-head {
  position: sticky; top: 0; z-index: 30;
  backdrop-filter: blur(12px);
  background: rgba(244, 239, 228, 0.78);
  border-bottom: 1px solid rgba(226, 219, 201, 0.8);
}
.site-head .row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px;
  padding: 16px 0;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 9px;
  background: var(--teal); color: var(--bone);
  display: grid; place-items: center;
  font-family: 'Lora', serif; font-size: 21px; font-weight: 600;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.brand-mark::after {
  content: ''; position: absolute; right: -2px; bottom: -2px;
  width: 10px; height: 10px; border-radius: 3px;
  background: var(--sienna);
  box-shadow: 0 2px 6px rgba(194, 114, 74, 0.4);
}
.brand-name {
  font-family: 'Lora', serif;
  font-size: 22px; font-weight: 500; letter-spacing: 0.2px;
  color: var(--ink);
}
.head-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.lang-toggle {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  padding: 3px;
  box-shadow: var(--shadow-sm);
}
.lang-toggle button {
  border: 0; background: transparent;
  padding: 7px 14px;
  font-size: 13px; font-weight: 500;
  border-radius: var(--radius-pill);
  cursor: pointer; color: var(--ink-soft);
}
.lang-toggle button.is-active { background: var(--teal); color: var(--bone); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 22px; border-radius: var(--radius-soft); border: 0;
  cursor: pointer; font-weight: 600; font-size: 15px;
  background: var(--teal); color: var(--bone);
  transition: transform .12s ease, box-shadow .2s ease;
  box-shadow: var(--shadow-sm);
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn.ghost { background: transparent; border: 1px solid var(--teal); color: var(--teal); box-shadow: none; }
.btn.sienna { background: var(--sienna); color: #fff; }
.btn.sm { padding: 10px 16px; font-size: 13px; }

/* ---------- Store badges ---------- */
.store-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.store-badge {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 10px 18px;
  background: var(--ink); color: var(--bone);
  border-radius: var(--radius-soft); min-width: 184px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: transform .12s ease, box-shadow .2s ease;
  box-shadow: var(--shadow-sm);
}
.store-badge:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.store-badge .glyph { width: 32px; height: 32px; display: grid; place-items: center; color: var(--bone); }
.store-badge .lbl { display: flex; flex-direction: column; line-height: 1.1; }
.store-badge .lbl .small { font-size: 10px; opacity: 0.78; letter-spacing: 0.6px; text-transform: uppercase; }
.store-badge .lbl .big { font-family: 'Lora', serif; font-size: 19px; font-weight: 500; }

.store-badge.rustore {
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line);
  position: relative;
}
.store-badge.rustore::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  border-radius: var(--radius-soft) 0 0 var(--radius-soft);
  background: var(--sienna);
}
.store-badge.rustore .glyph { color: var(--teal); }
.store-badge.rustore .lbl .small { color: var(--ink-soft); opacity: 1; }

/* ---------- Hero with inline matcher ---------- */
.hero { position: relative; padding: 56px 0 72px; overflow: hidden; }
.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
  align-items: start;
}
@media (max-width: 940px) { .hero-grid { grid-template-columns: 1fr; gap: 40px; } }
.hero h1 .accent { color: var(--teal); }
.hero .trust-line {
  margin-top: 24px;
  display: flex; align-items: center; gap: 14px;
  font-size: 13px; color: var(--ink-soft);
  flex-wrap: wrap;
}
.trust-line .dot { width: 4px; height: 4px; background: var(--sienna); border-radius: 50%; }
.hero-cta-stack { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
.hero-cta-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ---------- Matcher widget ---------- */
.matcher {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  box-shadow: var(--shadow-md);
  position: relative;
}
.matcher::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  border-radius: 18px 0 0 18px;
  background: var(--sienna);
}
.matcher-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px;
}
.matcher-head .lbl {
  font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--sienna-ink); font-weight: 700;
}
.matcher-head .count { font-size: 12px; color: var(--ink-soft); font-weight: 500; }

.matcher-q {
  font-family: 'Lora', serif; font-size: 18px; font-weight: 500;
  color: var(--teal-deep);
  margin-bottom: 14px; line-height: 1.3;
}
.condition-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 18px;
}
.cond-chip {
  border: 1px solid var(--line);
  background: var(--bone);
  color: var(--ink-soft);
  padding: 8px 14px;
  border-radius: var(--radius-pill);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.cond-chip:hover { border-color: var(--teal-soft); color: var(--teal); }
.text-input-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.text-input {
  flex: 1; min-width: 0;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-soft);
  background: var(--bone);
  font: inherit; font-size: 14px;
  color: var(--ink);
  transition: border-color .15s ease, background .15s ease;
}
.text-input::placeholder { color: var(--ink-soft); }
.text-input:focus { border-color: var(--teal); outline: none; background: var(--surface); }
.text-input:disabled { opacity: 0.6; cursor: not-allowed; }
.submit-btn {
  width: 44px; height: 44px; flex: 0 0 44px;
  border: 0; border-radius: var(--radius-soft);
  background: var(--teal); color: var(--bone);
  cursor: pointer; font-size: 18px;
  display: grid; place-items: center;
  transition: opacity .15s ease, transform .15s ease;
}
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.submit-btn:not(:disabled):hover { transform: translateY(-1px); }
.loader-dot {
  display: block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--bone);
  animation: ldot 0.9s infinite ease-in-out;
}
@keyframes ldot {
  0%, 100% { opacity: 0.3; transform: scale(0.7); }
  50%      { opacity: 1;   transform: scale(1.2); }
}
.loading-line {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--ink-soft);
  padding: 4px 2px 12px;
}
.loading-line::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--sienna); animation: ldot 0.9s infinite ease-in-out;
}
.or-row {
  font-size: 11.5px; color: var(--ink-soft);
  margin: 4px 0 10px;
  letter-spacing: 0.4px;
  text-transform: lowercase;
}
.no-match {
  font-size: 13px; color: var(--ink-soft);
  background: var(--bone-warm);
  border: 1px solid var(--line);
  border-radius: var(--radius-soft);
  padding: 12px 14px;
  margin-top: 8px;
  line-height: 1.6;
}
.submit-btn.submit-btn--text {
  width: auto; flex: 0 0 auto;
  padding: 0 18px;
  font-size: 14px; font-weight: 600;
  height: 44px;
}
.cond-chip.is-active {
  background: var(--teal); color: var(--bone); border-color: var(--teal);
}

.match-list { display: flex; flex-direction: column; gap: 10px; }
.match-card {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 12px; align-items: center;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--bone-warm);
  transition: transform .12s ease, box-shadow .2s ease, background .15s ease;
}
.match-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); background: var(--surface); }
.match-card .thumb {
  width: 56px; height: 56px; border-radius: 10px;
  display: grid; place-items: center;
  font-family: 'Lora', serif; font-size: 22px; font-weight: 600;
  color: var(--bone);
}
.match-card .body { min-width: 0; }
.match-card .name { font-weight: 600; font-size: 14px; color: var(--ink); }
.match-card .why { font-size: 12px; color: var(--ink-soft); margin-top: 3px; line-height: 1.45; }
.match-card .price { text-align: right; }
.match-card .price .num { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; color: var(--teal-deep); }
.match-card .price .unit { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

.thumb.lans      { background: linear-gradient(135deg, #A8B2A8 0%, #3F4A47 100%); }
.thumb.bad-ragaz { background: linear-gradient(135deg, #7E8B8E 0%, #3A4549 100%); }
.thumb.sha       { background: linear-gradient(135deg, #C5B8A3 0%, #7A6D56 100%); }
.thumb.karlovy   { background: linear-gradient(135deg, #B89970 0%, #5C4220 100%); }
.thumb.marianske { background: linear-gradient(135deg, #B0A488 0%, #5C4F33 100%); }
.thumb.heviz     { background: linear-gradient(135deg, #8AA398 0%, #3D5447 100%); }
.thumb.rixos     { background: linear-gradient(135deg, #C29066 0%, #6E4D2E 100%); }
.thumb.atmanjai  { background: linear-gradient(135deg, #97A88E 0%, #4A5A40 100%); }
.thumb.kislovodsk{ background: linear-gradient(135deg, #9DA67A 0%, #4F5536 100%); }
.thumb.velingrad { background: linear-gradient(135deg, #A38670 0%, #5A4231 100%); }
.thumb.altay     { background: linear-gradient(135deg, #6F8B82 0%, #2D423B 100%); }
.thumb.heritance { background: linear-gradient(135deg, #B8A47C 0%, #6B5832 100%); }
.thumb.terme     { background: linear-gradient(135deg, #8FA6A2 0%, #3F5650 100%); }

.matcher-foot {
  margin-top: 14px;
  font-size: 12px; color: var(--ink-soft);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 8px;
}
.matcher-foot .open { color: var(--teal); font-weight: 600; }

/* ---------- Section frame ---------- */
.section { padding: 80px 0; }
.section.alt { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.section-head { max-width: 720px; margin-bottom: 40px; }
.section-head h2 { margin-top: 8px; color: var(--teal-deep); }
.section-head p { margin: 16px 0 0; }

/* ---------- How it works ---------- */
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
@media (max-width: 820px) { .steps { grid-template-columns: 1fr; } }
.step {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 26px;
  transition: transform .15s ease, box-shadow .2s ease;
}
.step:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.step .num {
  width: 36px; height: 36px; border-radius: 10px;
  background: rgba(27,77,84,0.07);
  color: var(--teal);
  display: grid; place-items: center;
  font-family: 'Lora', serif; font-size: 18px; font-weight: 600;
  margin-bottom: 18px;
}
.step h3 { color: var(--teal-deep); margin-bottom: 8px; }
.step p { color: var(--ink-soft); font-size: 14px; line-height: 1.7; margin: 0; }

/* ---------- Browse by condition ---------- */
.cond-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
.cond-tile {
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 18px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  min-height: 130px;
  transition: transform .12s ease, box-shadow .2s ease, border-color .15s ease;
}
.cond-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: var(--teal-soft); }
.cond-tile .name { font-weight: 600; font-size: 16px; color: var(--ink); }
.cond-tile .meta { font-size: 12px; color: var(--ink-soft); margin-top: 6px; line-height: 1.55; }
.cond-tile .arr { color: var(--teal); font-size: 18px; align-self: flex-end; }

/* ---------- Featured venues (full grid) ---------- */
.venue-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 18px;
}
.venue-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  overflow: hidden;
  transition: transform .12s ease, box-shadow .2s ease;
}
.venue-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.venue-card .photo { height: 130px; position: relative; }
.venue-card .photo .price-badge {
  position: absolute; bottom: 10px; right: 10px;
  background: rgba(244,239,228,0.95);
  color: var(--teal-deep);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px; font-weight: 600;
}
.venue-card .body { padding: 16px 18px 18px; }
.venue-card .name { font-family: 'Lora', serif; font-size: 19px; font-weight: 500; color: var(--ink); }
.venue-card .loc { font-size: 12px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 0.4px; }
.venue-card .conds { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.chip-cond {
  padding: 4px 10px; border-radius: var(--radius-pill);
  background: rgba(27,77,84,0.07); color: var(--teal-deep);
  font-size: 11px; font-weight: 500;
  border: 1px solid rgba(27,77,84,0.18);
}

/* ---------- Trust block ---------- */
.trust-frame {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 18px;
  padding: 30px;
  background: linear-gradient(135deg, rgba(27,77,84,0.05) 0%, rgba(194,114,74,0.06) 100%);
  border: 1px solid var(--line);
  border-radius: 18px;
}
@media (max-width: 760px) { .trust-frame { grid-template-columns: 1fr; } }
.trust-stat .num {
  font-family: 'Lora', serif;
  font-size: 36px; font-weight: 600;
  color: var(--teal-deep);
  line-height: 1;
}
.trust-stat .lbl { font-size: 13px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
.trust-foot {
  margin-top: 20px;
  font-size: 14px; color: var(--ink-soft);
  line-height: 1.65; max-width: 760px;
}

/* ---------- Privacy (compact) ---------- */
.privacy-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 760px) { .privacy-row { grid-template-columns: 1fr; } }
.privacy-item {
  background: var(--bone-warm);
  border: 1px solid var(--line);
  border-radius: var(--radius-soft);
  padding: 18px 20px;
}
.privacy-item h4 { margin: 0 0 6px; font-size: 14.5px; color: var(--teal-deep); font-weight: 600; }
.privacy-item p { margin: 0; font-size: 13.5px; color: var(--ink-soft); line-height: 1.65; }

/* ---------- For doctors ---------- */
.doctors-block {
  display: flex; gap: 24px; align-items: center; justify-content: space-between;
  padding: 26px 32px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  flex-wrap: wrap;
}
.doctors-block .copy { max-width: 640px; }
.doctors-block .eyebrow { color: var(--sienna-ink); }
.doctors-block h3 { color: var(--teal-deep); margin: 8px 0 6px; }
.doctors-block p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.65; }

/* ---------- FAQ ---------- */
.faq-list { display: flex; flex-direction: column; gap: 10px; max-width: 820px; margin: 0 auto; }
.faq {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-soft);
  overflow: hidden;
}
.faq summary {
  padding: 18px 22px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; list-style: none;
  font-weight: 600; color: var(--teal-deep); font-size: 15px;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after {
  content: '+';
  font-family: 'Lora', serif;
  font-size: 22px; color: var(--sienna-ink); font-weight: 500;
}
.faq[open] summary::after { content: '–'; }
.faq .faq-body { padding: 0 22px 20px; color: var(--ink-soft); font-size: 14px; line-height: 1.7; }

/* ---------- Footer ---------- */
.site-foot {
  background: var(--teal-deep);
  color: rgba(244,239,228,0.7);
  padding: 56px 0 24px;
}
.site-foot a { color: var(--bone); }
.foot-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 32px;
}
@media (max-width: 820px) { .foot-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 540px) { .foot-grid { grid-template-columns: 1fr; } }
.foot-brand .brand-name { color: var(--bone); }
.foot-brand .tag { font-family: 'Lora', serif; font-size: 16px; color: rgba(244,239,228,0.78); margin-top: 12px; max-width: 320px; line-height: 1.45; }
.foot-col h5 {
  font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--sienna-soft); font-weight: 700; margin: 0 0 14px;
}
.foot-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.foot-col p { margin: 0 0 8px; font-size: 13px; line-height: 1.55; }
.foot-bottom {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid rgba(244,239,228,0.1);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  font-size: 12px; color: rgba(244,239,228,0.55);
}
.foot-bottom .legal { display: flex; gap: 18px; flex-wrap: wrap; }

function Matcher({ t, lang, selected, setSelected, matched }) {
  const top = matched.slice(0, 3);
  const [query, setQuery] = useState("");
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [didMatch, setDidMatch] = useState(false);

  const handleSubmit = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (!query.trim() || loading) return;
    setLoading(true);
    setTimeout(() => {
      const inferred = inferSituation(query);
      if (inferred) {
        setSelected(inferred);
        setDidMatch(true);
      } else {
        setDidMatch(false);
      }
      setSearched(true);
      setLoading(false);
    }, 900);
  };

  const showResults = searched && didMatch && !loading;
  const showNoMatch = searched && !didMatch && !loading;

  return (
    <div className="matcher" aria-live="polite">
      <div className="matcher-head">
        <span className="lbl">{t.matcher.lbl}</span>
        {showResults && <span className="count">{top.length}{t.matcher.countSuffix}</span>}
      </div>
      <div className="matcher-q">{t.matcher.q}</div>
      <form className="text-input-row" onSubmit={handleSubmit}>
        <input
          type="text"
          className="text-input"
          placeholder={t.matcher.input_ph}
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          disabled={loading}
        />
        <button
          type="submit"
          className="submit-btn submit-btn--text"
          disabled={loading || !query.trim()}
        >
          {loading ? <span className="loader-dot"/> : t.matcher.submit_a}
        </button>
      </form>
      {loading && <div className="loading-line">{t.matcher.loading}</div>}
      {showNoMatch && <div className="no-match">{t.matcher.no_match}</div>}
      {showResults && (
        <React.Fragment>
          <div className="match-list" style={{ marginTop: 16 }}>
            {top.map(v => (
              <div className="match-card" key={v.id}>
                <div className={"thumb " + v.thumb}>{v.name[lang].charAt(0)}</div>
                <div className="body">
                  <div className="name">{v.name[lang]}</div>
                  <div className="why">{v.rationale[selected][lang]}</div>
                </div>
                <div className="price">
                  <div className="num">{t.matcher.from} €{v.price.toLocaleString(lang === "ru" ? "ru-RU" : "en-US")}</div>
                  <div className="unit">{t.matcher.per}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="matcher-foot">
            <span>{t.matcher.lbl}: {CONDITIONS.find(c => c.id === selected)[lang]}</span>
            <a href="#venues" className="open">{t.matcher.open_all}</a>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function Conditions({ t, lang, setSelected }) {
  // For each condition, count matching venues and find the cheapest "from €X" tile metadata.
  const tiles = CONDITIONS.map(c => {
    const matches = VENUES.filter(v => Object.prototype.hasOwnProperty.call(v.rationale, c.id));
    const minPrice = matches.length ? Math.min(...matches.map(v => v.price)) : null;
    return { ...c, count: matches.length, min: minPrice };
  });
  return (
    <section className="section" id="conds">
      <div className="container">
        <div className="section-head">
          <div className="eyebrow">{t.conds.eyebrow}</div>
          <h2 className="serif">{t.conds.title}</h2>
          <p className="lede">{t.conds.lede}</p>
        </div>
        <div className="cond-grid">
          {tiles.map(tile => (
            <a
              className="cond-tile"
              key={tile.id}
              href="#"
              onClick={e => { e.preventDefault(); setSelected(tile.id); window.scrollTo({ top: 0, behavior: "smooth" }); }}
            >
              <div>
                <div className="name">{tile[lang]}</div>
                <div className="meta">{tile.count} {t.conds.meta_pref} · {t.matcher.from} €{tile.min.toLocaleString(lang === "ru" ? "ru-RU" : "en-US")}</div>
              </div>
              <div className="arr">→</div>
            </a>
          ))}
        </div>
      </div>
    </section>
  );
}
